<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 ToritoMusic en Vivo</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1f1f1f;
      --primary: #ff0033;
      --text: #ffffff;
      --text-secondary: #aaa;
    }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container { width: 100%; max-width: 600px; padding-bottom: 40px; }
    h1 { text-align: center; margin-bottom: 5px; font-size: 1.8rem; }
    .subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 25px; font-size: 0.95rem; }
    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
    input {
      flex: 1;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #121212;
      color: white;
      font-size: 1rem;
    }
    input:focus { outline: 1px solid var(--primary); }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .queue-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
    .queue-item {
      background: #252525;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid var(--primary);
    }
    .queue-info strong { display: block; font-size: 0.95rem; margin-bottom: 3px; }
    .queue-info small { color: var(--text-secondary); }
    #player-container { margin-top: 15px; text-align: center; }
    iframe { border-radius: 8px; width: 100%; height: 250px; border: none; }
    
    /* Estilo de la firma */
    .signature {
      position: fixed;
      bottom: 15px;
      right: 20px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.85rem;
      letter-spacing: 1px;
      pointer-events: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎧 ToritoMusic en Vivo</h1>
    <p class="subtitle">Agregá temas de YouTube y sonarán al instante</p>

    <!-- Buscador -->
    <div class="card">
      <h3>Agregar canción</h3>
      <div style="margin-bottom: 10px;">
        <input type="text" id="nombreUsuario" placeholder="Tu apodo / nombre" style="width: 100%; margin-bottom: 10px; box-sizing: border-box;">
      </div>
      <div class="search-box">
        <input type="text" id="busquedaInput" placeholder="Pegá el link de YouTube acá..." onkeypress="if(event.key === 'Enter') buscarVideos()">
        <button onclick="buscarVideos()">Agregar</button>
      </div>
    </div>

    <!-- Reproductor Activo -->
    <div class="card">
      <h3>Reproduciendo ahora</h3>
      <div id="current-playing" style="margin-bottom: 10px; color: var(--text-secondary);">No hay música sonando.</div>
      <div id="player-container">
        <div id="yt-player"></div>
      </div>
    </div>

    <!-- Cola -->
    <div class="card">
      <h3>Cola de reproducción</h3>
      <div id="queue" class="queue-list">
        <div style="color: var(--text-secondary); text-align: center; padding: 10px;">La cola está vacía</div>
      </div>
    </div>
  </div>

  <!-- Firma en la esquina -->
  <div class="signature">By ElToro ⚡</div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    let currentVideoId = null;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '250',
        width: '100%',
        videoId: '',
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    async function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        await fetch('/api/next', { method: 'POST' });
        actualizarEstado();
      }
    }

    async function buscarVideos() {
      const q = document.getElementById('busquedaInput').value;
      if (!q) return;
      
      let videoId = q;
      if (q.includes('youtube.com') || q.includes('youtu.be')) {
        const urlParams = new URLSearchParams(new URL(q).search);
        videoId = urlParams.get('v') || q.split('/').pop();
      } else {
        alert("Pegá un link válido de YouTube de la canción que quieras agregar 🎵");
        return;
      }

      let user = document.getElementById('nombreUsuario').value || 'Anónimo';

      await fetch('/api/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: q, videoId: videoId, user })
      });

      document.getElementById('busquedaInput').value = '';
      actualizarEstado();
    }

    async function actualizarEstado() {
      const res = await fetch('/api/state');
      const data = await res.json();
      
      const queueEl = document.getElementById('queue');
      queueEl.innerHTML = '';

      if (data.playlist.length === 0) {
        queueEl.innerHTML = '<div style="color: var(--text-secondary); text-align: center; padding: 10px;">La cola está vacía</div>';
      } else {
        const nextSong = data.playlist[0];
        if (currentVideoId !== nextSong.videoId) {
          currentVideoId = nextSong.videoId;
          if (player && player.loadVideoById) {
            player.loadVideoById(currentVideoId);
            document.getElementById('current-playing').innerText = `Sonando: Pedido por ${nextSong.user}`;
          }
        }

        data.playlist.forEach((item, index) => {
          if (index > 0) {
            queueEl.innerHTML += `
              <div class="queue-item">
                <div class="queue-info">
                  <strong>Video ID: ${item.videoId}</strong>
                  <small>Pedido por: ${item.user}</small>
                </div>
              </div>
            `;
          }
        });
      }
    }

    setInterval(actualizarEstado, 3000);
  </script>
</body>
</html>
